<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Motherboard Renderer Smoke Test</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
      }
      .container {
        display: flex;
        height: 100vh;
      }
      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #222;
      }
      .pane:first-child {
        border-left: 0;
      }
      .toolbar {
        padding: 8px;
        background: #0b0b0b;
        color: #fff;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      iframe {
        flex: 1;
        border: 0;
      }
      .label {
        font-size: 13px;
        opacity: 0.9;
      }
      .btn {
        background: #222;
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        border: 0;
        cursor: pointer;
      }
      .opts {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="label">Motherboard Renderer Smoke Test</div>
      <button id="reloadBtn" class="btn">Reload both</button>
      <div class="opts">
        <label class="label"><input id="syncScroll" type="checkbox" /> Sync scroll</label>
        <label class="label"><input id="syncReload" type="checkbox" checked /> Sync reload</label>
      </div>
    </div>
    <div class="container">
      <div class="pane">
        <div class="toolbar" style="background: #071013">
          <div class="label">New renderer (feature flag ON)</div>
        </div>
        <iframe
          id="left"
          src="./index.html?new-renderer=true&seedDemo=true"
          title="new-renderer"
        ></iframe>
      </div>
      <div class="pane">
        <div class="toolbar" style="background: #071013">
          <div class="label">Legacy renderer (feature flag OFF)</div>
        </div>
        <iframe id="right" src="./index.html?seedDemo=true" title="legacy-renderer"></iframe>
      </div>
    </div>

    <script>
      const left = document.getElementById('left');
      const right = document.getElementById('right');
      const reloadBtn = document.getElementById('reloadBtn');
      const syncScroll = document.getElementById('syncScroll');
      const syncReload = document.getElementById('syncReload');

      reloadBtn.addEventListener('click', () => {
        if (syncReload.checked) {
          left.contentWindow.location.reload();
          right.contentWindow.location.reload();
        } else {
          left.contentWindow.location.reload();
        }
      });

      // Optional: sync scroll positions between iframes
      if (syncScroll) {
        syncScroll.addEventListener('change', () => {
          if (syncScroll.checked) {
            // postMessage based synchronization - frames will need to implement a handler to respond
            // (left intentionally simple; manual comparison is recommended)
            // We leave hooks here for future camera-sync implementation.
          }
        });
      }
    </script>
  </body>
</html>
